<title>Prévia LumeOS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
/* Layout: desktop em tela cheia, barra de tarefas inferior, janelas arrastáveis.
   Paleta: preto, cinza e branco. Tipos: Space Grotesk (títulos e números) + Inter (interface).
   Movimento: curvas e tempos do guia de movimento do Windows 11, só transform e opacity quando possível. */
:root{
  --glass:rgba(250,250,255,.93); --glass-solid:#fbfbff; --line:rgba(24,28,72,.11);
  --fg:#1b1d2e; --muted:#656a85; --accent:#4f5df5; --accent-fg:#ffffff;
  --win:#ffffff; --win-bar:#f2f3fb; --tile:#e9ebf6; --danger:#e5484d;
  --snake-a:#c4ebd3; --snake-b:#b2e0c5;
  --shadow:0 18px 44px rgba(16,20,70,.26),0 1px 6px rgba(16,20,70,.12);
  --font-ui:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --bar-h:96px; --top-h:30px; --dk:50px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --glass:rgba(28,31,46,.94); --glass-solid:#1c1f2e; --line:rgba(255,255,255,.12);
    --fg:#f0f2fc; --muted:#a4aac6; --accent:#8b97ff; --accent-fg:#0f1226;
    --win:#1f2233; --win-bar:#292d42; --tile:#31364d; --danger:#ff6b72;
    --snake-a:#1f3d31; --snake-b:#1a3529;
    --shadow:0 18px 44px rgba(0,0,0,.55),0 1px 6px rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --glass:rgba(28,31,46,.94); --glass-solid:#1c1f2e; --line:rgba(255,255,255,.12);
  --fg:#f0f2fc; --muted:#a4aac6; --accent:#8b97ff; --accent-fg:#0f1226;
  --win:#1f2233; --win-bar:#292d42; --tile:#31364d; --danger:#ff6b72;
  --snake-a:#1f3d31; --snake-b:#1a3529;
  --shadow:0 18px 44px rgba(0,0,0,.55),0 1px 6px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;overflow:hidden;background:#05060a;color:var(--fg);font-family:var(--font-ui);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* cores do texto sobre o papel de parede: claro em fundos escuros */
body{--desk-fg:var(--fg);--desk-muted:var(--muted);--desk-hover:var(--glass)}
body[data-tone="dark"]{--desk-fg:#ffffff;--desk-muted:rgba(255,255,255,.74);--desk-hover:rgba(255,255,255,.14)}

/* papel de parede: estático, desenhado uma vez (sem animação, sem filtro) */
#wall{position:fixed;inset:0;background:#05060a center/cover no-repeat}
#wall[data-wall="aurora"]{background:
  radial-gradient(48% 55% at 14% 18%,rgba(79,93,245,.60),transparent 70%),
  radial-gradient(44% 50% at 88% 22%,rgba(168,85,247,.48),transparent 70%),
  radial-gradient(52% 55% at 74% 98%,rgba(20,184,166,.42),transparent 72%),
  radial-gradient(40% 46% at 12% 92%,rgba(236,72,153,.38),transparent 70%),#05060a}
#wall[data-wall="aurora"]::after{content:"";position:absolute;left:50%;top:44%;width:58vmin;height:58vmin;transform:translate(-50%,-50%);border-radius:50%;border:1px solid rgba(255,255,255,.10);box-shadow:inset 0 0 90px rgba(99,102,241,.22),0 0 0 7vmin rgba(255,255,255,.014)}
#wall[data-wall="meia"]{background:
  radial-gradient(70% 60% at 50% 38%,rgba(99,102,241,.26),transparent 70%),
  radial-gradient(50% 40% at 50% 110%,rgba(236,72,153,.16),transparent 70%),#04050a}
#wall[data-wall="claro"]{background:
  radial-gradient(55% 60% at 14% 14%,#bfd0ff,transparent 70%),
  radial-gradient(50% 55% at 88% 20%,#f0c6ff,transparent 70%),
  radial-gradient(60% 55% at 70% 100%,#b8f0e4,transparent 72%),#eef1ff}
.spot{position:fixed;inset:0;background:center/cover no-repeat;opacity:0;transition:opacity 1.4s ease;pointer-events:none}
.spot.on{opacity:1}
#desktop{position:fixed;left:0;right:0;top:calc(var(--top-h) + env(safe-area-inset-top,0px));bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px));overflow:hidden}

/* ícones e widget da área de trabalho */
#icons{position:absolute;left:max(10px,env(safe-area-inset-left,0px));top:10px;bottom:10px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,86px);grid-auto-columns:88px;align-content:start;gap:2px}
.di{width:84px;height:82px;display:grid;justify-items:center;align-content:center;gap:6px;padding:6px 4px;border:0;background:none;border-radius:10px;font-size:12px;font-weight:500;color:var(--fg);text-align:center}
.di:hover{background:var(--glass)}
#icons .di{color:var(--desk-fg)}
#icons .di:hover{background:var(--desk-hover)}
body[data-tone="dark"] #icons .di span:last-child{text-shadow:0 1px 3px rgba(0,0,0,.55)}
.tile{position:relative;width:40px;height:40px;border-radius:22.5%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 68%,#fff) 0%,var(--c) 58%,color-mix(in srgb,var(--c) 84%,#000) 100%);border:0;box-shadow:0 2px 6px rgba(10,14,50,.28)}
.tile::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(255,255,255,.30),rgba(255,255,255,0) 52%);pointer-events:none}
.tile svg{position:relative;z-index:1}
.tile svg{width:70%;height:70%}
.di .tile{width:48px;height:48px}
#icons{--is:48px;grid-template-rows:repeat(auto-fill,calc(var(--is) + 38px));grid-auto-columns:calc(var(--is) + 40px)}
body[data-icons="p"] #icons{--is:38px}
body[data-icons="g"] #icons{--is:62px}
body[data-desk="0"] #icons{display:none}
#icons .di{width:calc(var(--is) + 36px);height:calc(var(--is) + 34px)}
#icons .di .tile{width:var(--is);height:var(--is)}#widget{position:absolute;right:max(20px,env(safe-area-inset-right,0px));top:18px;text-align:right;pointer-events:none;color:var(--desk-fg)}
body[data-tone="dark"] #widget{text-shadow:0 2px 14px rgba(0,0,0,.45)}
#widget b{display:block;font-family:var(--font-head);font-weight:500;font-size:52px;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
#widget span{display:block;margin-top:6px;color:var(--desk-muted);font-size:13px}
@media (max-width:760px){#widget{display:none}}
@media (max-width:560px){#icons{display:none}}

/* janelas */
.win{--accent:var(--c);--accent-fg:#fff;position:absolute;display:flex;flex-direction:column;background:var(--win);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;max-width:100%;contain:layout style paint;will-change:transform,opacity}
.win.max{border-radius:0;border-width:0}
.bar{display:flex;align-items:center;gap:10px;height:40px;padding:0 4px 0 12px;background:color-mix(in srgb,var(--c) 14%,var(--win-bar));border-bottom:1px solid var(--line);cursor:grab;touch-action:none}
.bar:active{cursor:grabbing}
.win:not(.active) .bar{opacity:.8}
.bar .ico{position:relative;width:22px;height:22px;border-radius:22.5%;display:grid;place-items:center;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 68%,#fff) 0%,var(--c) 58%,color-mix(in srgb,var(--c) 84%,#000) 100%)}
.bar .ico svg{width:80%;height:80%}
.ttl{flex:1;font-family:var(--font-head);font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctl{display:flex}
.ctl button{width:42px;height:34px;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--muted)}
.ctl button:hover{background:var(--line);color:var(--fg)}
.ctl button[data-a="close"]:hover{background:#e5484d;color:#fff}
.ctl svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.body{flex:1;min-height:0;overflow:auto;padding:16px;contain:layout style}
.win.max .body{display:grid;place-items:center}

/* partes comuns dos jogos e apps */
.game{position:relative;width:100%;max-width:440px;margin:0 auto;display:grid;gap:12px}
.hud{display:flex;align-items:center;gap:10px}
.hud>div{display:grid;min-width:72px;padding:6px 12px;border-radius:10px;background:var(--tile)}
.hud span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.hud b{font-family:var(--font-head);font-size:18px;font-variant-numeric:tabular-nums;color:var(--accent)}
.hud .btn{margin-left:auto}
.hud .btn+.btn{margin-left:0}
.btn{border:1px solid var(--line);background:var(--tile);padding:9px 14px;border-radius:9px;font-weight:600}
.btn:hover{filter:brightness(1.06)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:transparent}
.hint{margin:0;color:var(--muted);font-size:12px}
.stage{position:relative}
.ov{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;text-align:center;padding:16px;border-radius:12px;background:color-mix(in srgb,var(--win) 90%,transparent);z-index:3}
.ov p{margin:0;font-family:var(--font-head);font-size:17px;font-weight:600;max-width:24ch;text-wrap:balance}
.snake canvas{display:block;width:100%;height:auto;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);touch-action:none}
.pad{display:none;grid-template-columns:repeat(4,1fr);gap:8px}
.pad button{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--tile);font-size:18px}
@media (pointer:coarse){.pad{display:grid}}

/* 2048: peças deslizam por transform */
.board{--gap:8px;position:relative;aspect-ratio:1;padding:var(--gap);border-radius:12px;background:var(--tile);touch-action:none}
.board .bg{position:absolute;inset:var(--gap);display:grid;grid-template:repeat(4,1fr)/repeat(4,1fr);gap:var(--gap)}
.cell{border-radius:9px;background:color-mix(in srgb,var(--fg) 7%,transparent)}
.tiles{position:absolute;inset:var(--gap)}
.tile2{position:absolute;left:0;top:0;width:calc((100% - 3 * var(--gap)) / 4);aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-family:var(--font-head);font-weight:600;font-size:clamp(20px,7vw,32px);font-variant-numeric:tabular-nums;background:var(--tile);transition:transform .12s cubic-bezier(0,0,0,1);will-change:transform}
.tile2.sm{font-size:clamp(15px,5vw,24px)}

.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{aspect-ratio:1;border:0;padding:0;background:none;perspective:600px}
.card .in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .3s cubic-bezier(.3,.7,.2,1)}
.card.flip .in{transform:rotateY(180deg)}
.f{position:absolute;inset:0;display:grid;place-items:center;border-radius:11px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.f.back{background:linear-gradient(145deg,color-mix(in srgb,var(--accent) 80%,#fff),var(--accent));box-shadow:inset 0 0 0 4px color-mix(in srgb,#fff 25%,transparent)}
.f.front{transform:rotateY(180deg);background:var(--win);color:var(--sc,var(--fg));font-size:clamp(22px,7vw,32px);font-weight:600;border:1px solid var(--line)}
.card.done .f.front{background:color-mix(in srgb,var(--sc,var(--accent)) 16%,var(--win));border-color:color-mix(in srgb,var(--sc,var(--accent)) 45%,transparent)}

.mines{display:grid;grid-template-columns:repeat(9,1fr);gap:3px}
.mc{aspect-ratio:1;border:0;border-radius:6px;padding:0;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 26%,var(--win-bar));font-family:var(--font-head);font-weight:600;font-size:clamp(12px,4vw,16px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.12)}
.mc.open{background:color-mix(in srgb,var(--fg) 5%,var(--win));box-shadow:none;cursor:default}
.mc.flag{color:var(--danger)}
.mc.boom{background:var(--danger);color:#fff}

.calc{display:grid;gap:8px;max-width:300px;width:100%;margin:0 auto}
.disp{display:grid;align-content:end;min-height:84px;padding:12px 14px;border-radius:12px;background:var(--tile);text-align:right}
.disp small{min-height:16px;color:var(--muted);font-size:12px}
.disp b{font-family:var(--font-head);font-size:34px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.keys button{height:48px;border:0;border-radius:10px;background:var(--tile);font-family:var(--font-head);font-size:18px;font-weight:500}
.keys button.op{background:color-mix(in srgb,var(--c) 18%,var(--tile));color:color-mix(in srgb,var(--c) 70%,var(--fg))}
.keys button[data-k="clr"]{color:var(--danger)}
.keys button.eq{background:var(--accent);color:var(--accent-fg)}
.keys button:active{filter:brightness(.92)}

.notes{display:grid;gap:8px}
.notes textarea{width:100%;height:240px;resize:none;border:1px solid var(--line);border-radius:10px;background:var(--win-bar);color:var(--fg);padding:12px;font:inherit;line-height:1.5;user-select:text;-webkit-user-select:text}
.notes small{color:var(--muted)}

.set{display:grid}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row b{display:block;font-weight:600}
.row span{color:var(--muted);font-size:12px}
.row .btn+.btn{margin-left:6px}
.seg{display:flex;flex-wrap:wrap;gap:2px;padding:3px;border-radius:10px;background:var(--tile)}
.seg button{border:0;background:none;padding:6px 10px;border-radius:7px;font-size:12px;font-weight:500}
.seg button[aria-checked="true"]{background:var(--accent);color:var(--accent-fg)}
.sw{position:relative;flex:none;width:42px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--tile)}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(18px);background:var(--accent-fg)}

.about{display:grid;gap:14px}
.about h2{margin:0;font-family:var(--font-head);font-size:22px}
.about p{margin:0;color:var(--muted);line-height:1.5}
.about dl{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;padding:12px;border-radius:10px;background:var(--tile)}
.about dt{color:var(--muted)}.about dd{margin:0;font-weight:500}

/* barra superior, como a do macOS */
#menubar{position:fixed;left:0;right:0;top:0;height:calc(var(--top-h) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:4px;background:var(--glass);border-bottom:1px solid var(--line);z-index:1000;font-size:13px}
.mb{width:30px;height:24px;border:0;background:none;border-radius:7px;display:grid;place-items:center;color:var(--fg);padding:0}
.mb:hover{background:var(--line)}
.mb svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#appname{font-weight:600;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.grow{flex:1}
#clock{padding:0 6px;white-space:nowrap;font-variant-numeric:tabular-nums}
#clock b{font-weight:600;margin-left:6px}
@media (max-width:560px){#clock span{display:none}}

/* dock flutuante, como a do macOS */
body{--bar-h:calc(var(--dk) + 46px)}
body[data-hide="1"]{--bar-h:14px}
body[data-dock="p"]{--dk:38px}
body[data-dock="m"]{--dk:50px}
body[data-dock="g"]{--dk:64px}
#taskbar{transition:transform .2s cubic-bezier(.55,.55,0,1),opacity .15s}
body[data-hide="1"] #taskbar{transform:translateY(calc(100% + 24px));opacity:0;visibility:hidden;transition:transform .2s cubic-bezier(.55,.55,0,1),opacity .15s,visibility 0s .2s}
body[data-hide="1"] #taskbar.show{transform:none;opacity:1;visibility:visible;transition:transform .3s cubic-bezier(0,0,0,1),opacity .2s,visibility 0s}
#hot{position:fixed;left:0;right:0;bottom:0;height:8px;z-index:999;display:none}
body[data-hide="1"] #hot{display:block}
#taskbar{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;padding:0 12px;pointer-events:none;z-index:1000}
#dock{position:relative;isolation:isolate;pointer-events:auto;display:flex;align-items:flex-end;gap:6px;padding:9px 12px 11px;max-width:100%}
#dockbg{position:absolute;left:50%;top:0;bottom:0;width:100%;transform:translateX(-50%);border-radius:26px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);z-index:-1;pointer-events:none;transition:width .2s cubic-bezier(0,0,0,1)}
#dock.zoom #dockbg{transition:none}
.dk{position:relative;flex:none;width:var(--dk);height:var(--dk);border:0;background:none;padding:0;border-radius:30%;display:grid;place-items:center;transform-origin:50% 100%;will-change:transform;transition:transform .2s cubic-bezier(0,0,0,1)}
#dock.zoom .dk{transition:none}
.dk .tile{width:100%;height:100%}
.dk .tile svg{width:72%;height:72%}
.dk:active .tile{filter:brightness(.86)}
.dk.start{--c:#6d7bff}
.pip{position:absolute;bottom:-8px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--muted);opacity:0;transition:opacity .15s}
.dk.run .pip{opacity:1}
.dk.act .pip{background:var(--c,var(--accent))}
#dlabel{position:fixed;left:0;top:0;padding:4px 10px;border-radius:8px;background:var(--glass-solid);border:1px solid var(--line);box-shadow:var(--shadow);font-size:12px;font-weight:500;white-space:nowrap;pointer-events:none;z-index:1300;opacity:0;transition:opacity .12s}
#dlabel.show{opacity:1}
@media (max-width:560px){:root{--dk:40px}#dock{gap:4px;padding:8px 8px 10px}body[data-dock="p"]{--dk:32px}body[data-dock="m"]{--dk:40px}body[data-dock="g"]{--dk:46px}}

/* menu iniciar: sobe da barra, como no Windows 11 */
#start{position:fixed;left:50%;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px) + 10px);width:min(440px,calc(100vw - 24px));padding:16px;border-radius:16px;background:var(--glass);border:1px solid var(--line);box-shadow:var(--shadow);z-index:1100;display:grid;gap:14px;opacity:0;visibility:hidden;transform:translate(-50%,24px);transition:opacity .12s,transform .17s cubic-bezier(0,0,0,1),visibility 0s .17s}
#start.open{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .12s,transform .25s cubic-bezier(0,0,0,1),visibility 0s}
#q{width:100%;height:38px;border-radius:19px;border:1px solid var(--line);background:var(--win);color:var(--fg);padding:0 16px;font:inherit;user-select:text;-webkit-user-select:text}
#start h3{margin:0;font-family:var(--font-head);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
#sgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
#sgrid .di{width:100%;height:auto;min-height:88px;align-content:start}
#sfoot{display:flex;align-items:center;justify-content:space-between;padding-top:12px;border-top:1px solid var(--line)}
#sfoot span{font-weight:600}

#toast{position:fixed;left:50%;bottom:calc(var(--bar-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,10px);max-width:min(400px,calc(100vw - 32px));padding:10px 16px;border-radius:12px;background:var(--glass-solid);border:1px solid var(--line);box-shadow:var(--shadow);font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:1050;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#fps{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + var(--top-h) + 8px);padding:4px 9px;border-radius:8px;background:var(--glass-solid);border:1px solid var(--line);font:600 11px var(--font-ui);font-variant-numeric:tabular-nums;z-index:1200;pointer-events:none}

@media (prefers-reduced-motion:reduce){
  #start,#start.open,.card .in,.dk,.pip,#toast,.tile2,.spot,#dockbg,#taskbar{transition-duration:.01s!important}
}
</style>

<div id="wall" data-wall="aurora"></div>
<div id="spotA" class="spot"></div>
<div id="spotB" class="spot"></div>
<div id="desktop">
  <div id="icons"></div>
  <div id="widget"><b>--:--</b><span></span></div>

/* medidor de FPS */
const perf = { on: false, raf: 0, last: 0, t0: 0, frames: 0, worst: 0 };
const fpsEl = $('#fps');
function perfTick(ts){
  if (!perf.on) return;
  perf.raf = requestAnimationFrame(perfTick);
  if (!perf.t0) perf.t0 = ts;
  if (perf.last) perf.worst = Math.max(perf.worst, ts - perf.last);
  perf.last = ts; perf.frames++;
  if (ts - perf.t0 >= 500) {
    fpsEl.textContent = `${Math.round(perf.frames * 1000 / (ts - perf.t0))} FPS · pior quadro ${Math.round(perf.worst)} ms`;
    perf.frames = 0; perf.t0 = ts; perf.worst = 0;
  }
}
function setFps(on){

/* papel de parede: três fundos originais ou a imagem escolhida (guardada reduzida no navegador) */

const rng = seed => () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const SCENES = [
  { sky: ['#1b1446', '#6b2d8c', '#ff7e6b'], sun: { x: .7, y: .62, r: 70, c: '#ffd9a0' }, ridges: ['#4b2a74', '#35205f', '#221648', '#130d2e'] },
  { sky: ['#050816', '#0d1b4a', '#1d3a7a'], moon: { x: .25, y: .25, r: 46 }, stars: 150, ridges: ['#12254f', '#0c1a3d', '#08122b', '#040a1a'] },

  { sky: ['#06232b', '#0d5560', '#3cc4b4'], sun: { x: .8, y: .38, r: 50, c: '#e6fff7' }, ridges: ['#0b4a52', '#083a44', '#062c35', '#031c24'] },
  { sky: ['#0a0a14', '#1f1147', '#7c3aed'], aurora: true, stars: 100, ridges: ['#10102a', '#0a0a1c', '#05050f'] },
  { sky: ['#101a2e', '#33507a', '#9bb7e0'], sun: { x: .3, y: .5, r: 60, c: '#fff3d6' }, ridges: ['#4a6896', '#365078', '#243a5c', '#142238'] }

function sceneUri(sc, seed){
  const r = rng(seed), W = 1600, H = 900;
  const ridge = (base, amp) => {
    const p = [r() * 6.28, r() * 6.28, r() * 6.28], f = [1.2 + r() * 1.2, 3 + r() * 2, 7 + r() * 4];
    let d = `M0 ${H}`;
    for (let x = 0; x <= W; x += 20) {

    }

  };
  let g = `<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sc.sky[0]}"/><stop offset=".55" stop-color="${sc.sky[1]}"/><stop offset="1" stop-color="${sc.sky[2]}"/></linearGradient>`
    + `<radialGradient id="o"><stop offset="0" stop-color="${sc.sun ? sc.sun.c : '#fff'}" stop-opacity=".95"/><stop offset=".35" stop-color="${sc.sun ? sc.sun.c : '#dfe6ff'}" stop-opacity=".35"/><stop offset="1" stop-color="${sc.sun ? sc.sun.c : '#dfe6ff'}" stop-opacity="0"/></radialGradient>`
    + `<linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34d399" stop-opacity="0"/><stop offset=".5" stop-color="#34d399" stop-opacity=".5"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient></defs>`
    + `<rect width="${W}" height="${H}" fill="url(#s)"/>`;
  for (let i = 0; i < (sc.stars || 0); i++) g += `<circle cx="${(r() * W).toFixed(0)}" cy="${(r() * H * .55).toFixed(0)}" r="${(r() * 1.4 + .3).toFixed(1)}" fill="#fff" opacity="${(r() * .6 + .3).toFixed(2)}"/>`;
  if (sc.aurora) for (let k = 0; k < 3; k++) {
    const y0 = 160 + k * 70, ph = r() * 6;
    let d = `M0 ${y0}`;
    for (let x = 0; x <= W; x += 40) d += ` L${x} ${(y0 + 50 * Math.sin(x / 210 + ph)).toFixed(0)}`;

const spot = { i: 0, cur: 1, timer: 0, uris: [] };

}
function pickWall(file){
  if (!file || !/^image\//.test(file.type)) { toast('Escolha um arquivo de imagem.', 3000); return; }
  const url = URL.createObjectURL(file), img = new Image();
  img.onload = () => {
    const k = Math.min(1, 1920 / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.width * k)); c.height = Math.max(1, Math.round(img.height * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    let data = '', lum = 0;
    try {
      data = c.toDataURL('image/jpeg', .82);
      const s = document.createElement('canvas'); s.width = s.height = 16;
      const sx = s.getContext('2d'); sx.drawImage(c, 0, 0, 16, 16);
      const px = sx.getImageData(0, 0, 16, 16).data;
      for (let i = 0; i < px.length; i += 4) lum += .2126 * px[i] + .7152 * px[i + 1] + .0722 * px[i + 2];
      lum /= 256 * 255;
    } catch (e) { data = ''; }
    URL.revokeObjectURL(url);
    if (!data) { toast('Não consegui ler essa imagem.', 3000); return; }
    wallImg = data;
    store.set('lume-wall-img', data); store.set('lume-wall-tone', lum > .55 ? 'light' : 'dark');
    settings.wall = 'custom'; saveSettings(); applySettings();
  };
  img.onerror = () => { URL.revokeObjectURL(url); toast('Não consegui abrir essa imagem.', 3000); };
  img.src = url;
}
function clearWall(){
  wallImg = ''; store.set('lume-wall-img', ''); store.set('lume-wall-tone', '');
  if (settings.wall === 'custom') settings.wall = 'aurora';

}

function buildSnake(body){

    <div class="hud"><div><span>Pontos</span><b data-s>0</b></div><div><span>Recorde</span><b data-b>0</b></div></div>
    <div class="stage"><canvas></canvas><div class="ov"><p data-m></p><button class="btn pri" data-go type="button"></button></div></div>
    <div class="pad"><button data-d="left" aria-label="Esquerda">←</button><button data-d="up" aria-label="Cima">↑</button><button data-d="down" aria-label="Baixo">↓</button><button data-d="right" aria-label="Direita">→</button></div></div>`;
  const N = 18, cv = $('canvas', body), ctx = cv.getContext('2d', { alpha: false });
  const bg = document.createElement('canvas'), bgx = bg.getContext('2d');
  const ov = $('.ov', body), mEl = $('[data-m]', body), go = $('[data-go]', body), sEl = $('[data-s]', body), bEl = $('[data-b]', body);
  const V = { left: { x: -1, y: 0 }, right: { x: 1, y: 0 }, up: { x: 0, y: -1 }, down: { x: 0, y: 1 } };
  let sn, old, dir, queue, food, score = 0, best = +store.get('lume-snake-best') || 0, state = 'idle', raf = 0, last = 0, acc = 0, px = 1;
  const stepMs = () => Math.max(62, 135 - score * 3);
  const msg = (text, btn) => { ov.hidden = false; mEl.textContent = text; go.textContent = btn; };
  const hud = () => { sEl.textContent = score; bEl.textContent = best; };
  function spawn(){
    let p, k = 0;
    do { p = { x: Math.random() * N | 0, y: Math.random() * N | 0 }; } while (k++ < 500 && sn.some(s => s.x === p.x && s.y === p.y));
    food = p;
  }
  function drawBg(){
    bg.width = bg.height = cv.width;
    bgx.fillStyle = COL['snake-a']; bgx.fillRect(0, 0, bg.width, bg.width);
    bgx.fillStyle = COL['snake-b'];
    for (let x = 0; x < N; x++) for (let y = 0; y < N; y++) if ((x + y) & 1) bgx.fillRect(x * px, y * px, px, px);
  }
  function rr(x, y, w, h, r){
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }
  function draw(a){
    ctx.drawImage(bg, 0, 0);
    const s = px, pulse = 1 + .08 * Math.sin(performance.now() / 180);
    ctx.fillStyle = '#ef4444';
    ctx.beginPath(); ctx.arc((food.x + .5) * s, (food.y + .5) * s, s * .32 * pulse, 0, 6.2832); ctx.fill();
    ctx.fillStyle = APPS.snake.c;

      const p = sn[i], f = old[Math.min(i, old.length - 1)];
      const x = f.x + (p.x - f.x) * a, y = f.y + (p.y - f.y) * a;
      ctx.globalAlpha = Math.max(.55, 1 - i * .025);
      rr(x * s + s * .07, y * s + s * .07, s * .86, s * .86, s * .26);
    }
    ctx.globalAlpha = 1;
  }
  function size(){
    const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.max(120, Math.round(cv.clientWidth * dpr));
    if (cv.width !== w) cv.width = cv.height = w;
    px = cv.width / N; drawBg(); draw(1);
  }
  const ro = new ResizeObserver(size); ro.observe(cv);
  function reset(){
    sn = [{ x: 9, y: 9 }, { x: 8, y: 9 }, { x: 7, y: 9 }]; old = sn.map(p => ({ ...p }));
    dir = V.right; queue = []; score = 0; spawn(); state = 'idle'; stopLoop();
    msg('Use as setas, WASD ou os botões', 'Jogar'); draw(1); hud();
  }
  function frame(ts){
    raf = requestAnimationFrame(frame);
    if (!last) last = ts;
    const dt = Math.min(100, ts - last); last = ts; acc += dt;
    let ms = stepMs();
    while (acc >= ms && state === 'run') { acc -= ms; step(); ms = stepMs(); }

/* ---------- jogo: 2048 (peças deslizam por transform) ---------- */
function build2048(body){
  body.innerHTML = `<div class="game g2048">
    <div class="hud"><div><span>Pontos</span><b data-s>0</b></div><div><span>Recorde</span><b data-b>0</b></div><button class="btn" data-n type="button">Novo jogo</button></div>
    <div class="stage"><div class="board"><div class="bg">${'<i class="cell"></i>'.repeat(16)}</div><div class="tiles"></div></div><div class="ov" hidden><p data-m></p><button class="btn pri" data-go type="button"></button></div></div>
    <p class="hint">Use as setas do teclado ou deslize sobre o tabuleiro.</p></div>`;
  const tilesEl = $('.tiles', body), board = $('.board', body), ov = $('.ov', body), mEl = $('[data-m]', body), go = $('[data-go]', body);
  let grid, score, best = +store.get('lume-2048-best') || 0, won, over, busy = false, pending = null, timers = [];
  const hud = () => { $('[data-s]', body).textContent = score; $('[data-b]', body).textContent = best; };
  const TC = [['#fff0c2', '#7a4b00'], ['#ffe08a', '#7a4b00'], ['#fb923c', '#431407'], ['#ea580c', '#fff'], ['#e11d48', '#fff'],
    ['#be185d', '#fff'], ['#9333ea', '#fff'], ['#7c3aed', '#fff'], ['#4f46e5', '#fff'], ['#2563eb', '#fff'], ['#0d9488', '#fff']];
  function paint(t){

    t.el.textContent = t.v;
    t.el.style.background = c[0]; t.el.style.color = c[1];
    t.el.classList.toggle('sm', t.v >= 1024);
  }
  function place(t){
    const r = t.p >> 2, c = t.p & 3;
    t.el.style.transform = `translate(calc(${c} * (100% + var(--gap))),calc(${r} * (100% + var(--gap))))`;
  }
  function spawn(){
    const e = []; for (let i = 0; i < 16; i++) if (!grid[i]) e.push(i);
    if (!e.length) return;
    const p = e[Math.random() * e.length | 0], v = Math.random() < .9 ? 2 : 4;
    const el = document.createElement('div'); el.className = 'tile2'; tilesEl.append(el);
    const t = { p, v, el }; grid[p] = t; paint(t); place(t);
    if (!reduced()) el.animate([{ scale: .6, opacity: 0 }, { scale: 1, opacity: 1 }], { duration: 160, easing: 'cubic-bezier(0,0,0,1)' });
  }
  function reset(){
    timers.forEach(clearTimeout); timers = [];
    tilesEl.textContent = ''; grid = Array(16).fill(null); score = 0; won = false; over = false; busy = false; pending = null;
    spawn(); spawn(); ov.hidden = true; hud();
  }
  const lines = d => {
    const L = [];
    for (let a = 0; a < 4; a++) {
      const l = [];
      for (let b = 0; b < 4; b++) l.push(d === 'left' ? a * 4 + b : d === 'right' ? a * 4 + 3 - b : d === 'up' ? b * 4 + a : (3 - b) * 4 + a);
      L.push(l);
    }
    return L;
  };
  const canMove = () => {
    for (let i = 0; i < 16; i++) {
      const t = grid[i]; if (!t) return true;
      if ((i & 3) < 3 && grid[i + 1] && grid[i + 1].v === t.v) return true;
      if (i < 12 && grid[i + 4] && grid[i + 4].v === t.v) return true;
    }
    return false;
  };
  function move(d){
    if (over) return;
    if (busy) { pending = d; return; }
    let moved = false; const dying = [], merged = [];
    for (const l of lines(d)) {
      let k = 0, last = null;
      for (let i = 0; i < 4; i++) {
        const p = l[i], t = grid[p]; if (!t) continue;
        grid[p] = null;
        if (last && !last.m && last.v === t.v) {
          last.v *= 2; last.m = true; score += last.v; t.p = last.p; dying.push(t); merged.push(last); moved = true;
        } else {
          const q = l[k++]; if (q !== p) moved = true; t.p = q; grid[q] = t; last = t;
        }
      }
    }
    merged.forEach(t => { t.m = false; t.el.style.zIndex = 1; });
    if (!moved) return;
    grid.forEach(t => { if (t) place(t); }); dying.forEach(place);

      dying.forEach(t => t.el.remove());
      merged.forEach(t => {
        paint(t); t.el.style.zIndex = '';
        if (!reduced()) t.el.animate([{ scale: 1 }, { scale: 1.15, offset: .5 }, { scale: 1 }], { duration: 160 });
      });
      spawn(); busy = false;
      if (!canMove()) { over = true; mEl.textContent = `Sem movimentos. ${score} pontos.`; go.textContent = 'Jogar de novo'; go.dataset.m = 'new'; ov.hidden = false; }
      else if (!won && grid.some(t => t && t.v >= 2048)) { won = true; mEl.textContent = 'Você chegou ao 2048.'; go.textContent = 'Continuar'; go.dataset.m = 'cont'; ov.hidden = false; }
      if (pending) { const n = pending; pending = null; move(n); }
    }, reduced() ? 10 : 130));
  }
  go.onclick = () => { if (go.dataset.m === 'new') reset(); else ov.hidden = true; };
  $('[data-n]', body).onclick = reset;
  let sx = 0, sy = 0;
  board.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY; });
  board.addEventListener('pointerup', e => {
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
  });
  reset();
  const map = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  return { key(e){ if (!map[e.key]) return false; move(map[e.key]); return true; }, destroy(){ timers.forEach(clearTimeout); } };
}

/* ---------- jogo: Campo Minado ---------- */
function buildMines(body){
  body.innerHTML = `<div class="game">
    <div class="hud"><div><span>Minas</span><b data-f>10</b></div><div><span>Tempo</span><b data-t>0</b></div>

    <div class="stage"><div class="mines" data-b></div><div class="ov" hidden><p data-m></p><button class="btn pri" data-go type="button">Jogar de novo</button></div></div>
    <p class="hint">Clique direito ou segure a casa para marcar bandeira.</p></div>`;
  const R = 9, M = 10, T = R * R;
  const NUMCOL = ['', '#2563eb', '#16a34a', '#dc2626', '#7c3aed', '#b45309', '#0d9488', '#334155', '#6b7280'];
  const board = $('[data-b]', body), ov = $('.ov', body), mEl = $('[data-m]', body), fEl = $('[data-f]', body), tEl = $('[data-t]', body), flagBtn = $('[data-flag]', body);

  const nb = i => {
    const r = i / R | 0, c = i % R, o = [];
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && rr < R && cc >= 0 && cc < R) o.push(rr * R + cc);
    }
    return o;
  };
  const hud = () => { fEl.textContent = M - flags; tEl.textContent = secs; };
  const stopTimer = () => { clearInterval(timer); timer = null; };
  const startTimer = () => { stopTimer(); timer = setInterval(() => { secs++; tEl.textContent = secs; }, 1000); };
  function paint(i){
    const c = cells[i], e = els[i];
    e.className = 'mc' + (c.o ? ' open' : '') + (c.f && !c.o ? ' flag' : '');
    e.textContent = c.f && !c.o ? '▲' : (c.o ? (c.m ? '✱' : (c.a || '')) : '');

  }
  function reset(){
    cells = Array.from({ length: T }, () => ({ m: false, a: 0, o: false, f: false }));
    started = false; over = false; flags = 0; opened = 0; secs = 0; stopTimer(); ov.hidden = true;
    board.innerHTML = cells.map((_, i) => `<button class="mc" data-i="${i}" aria-label="Casa ${i + 1}"></button>`).join('');
    els = [...board.children]; hud();
  }
  function plant(safe){
    const pool = []; for (let i = 0; i < T; i++) if (i !== safe) pool.push(i);
    for (let k = 0; k < M; k++) {
      const j = k + (Math.random() * (pool.length - k) | 0);
      [pool[k], pool[j]] = [pool[j], pool[k]]; cells[pool[k]].m = true;
    }

  }
  function lose(i){
    over = true; stopTimer();
    cells.forEach((c, j) => { if (c.m) { c.o = true; paint(j); } });

    mEl.textContent = 'Você pisou numa mina.'; ov.hidden = false;

    const b = e.target.closest('.mc'); if (!b) return;

  $('[data-go]', body).onclick = reset;
  reset();

/* ---------- Calculadora ---------- */
function buildCalc(body){
  const defs = [['C', 'clr', 'op'], ['⌫', 'bs', 'op'], ['%', 'pct', 'op'], ['÷', '/', 'op'], ['7'], ['8'], ['9'], ['×', '*', 'op'], ['4'], ['5'], ['6'], ['−', '-', 'op'], ['1'], ['2'], ['3'], ['+', '+', 'op'], ['±', 'neg', 'op'], ['0'], [',', '.'], ['=', '=', 'eq']];
  body.innerHTML = `<div class="calc"><div class="disp"><small data-h></small><b data-d>0</b></div>
    <div class="keys">${defs.map(d => `<button type="button" data-k="${d[1] || d[0]}" class="${d[2] || ''}">${d[0]}</button>`).join('')}</div></div>`;
  const dEl = $('[data-d]', body), hEl = $('[data-h]', body);
  const SYM = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  let cur = '0', acc = null, op = null, fresh = true;
  const raw = n => isFinite(n) ? String(+n.toPrecision(12)) : 'Erro';
  const calc = (a, b, o) => o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : (b === 0 ? NaN : a / b);
  const show = () => { dEl.textContent = cur.replace('.', ','); };
  function press(k){
    if (cur === 'Erro' && k !== 'clr') { cur = '0'; acc = null; op = null; fresh = true; hEl.textContent = ''; }
    if (/^[0-9]$/.test(k)) {
      if (fresh) { cur = k; fresh = false; } else if (cur.replace(/[-.]/g, '').length < 14) cur = cur === '0' ? k : cur + k;
    } else if (k === '.') {
      if (fresh) { cur = '0.'; fresh = false; } else if (!cur.includes('.')) cur += '.';
    } else if (SYM[k]) {
      if (op && !fresh) { acc = calc(acc, +cur, op); cur = raw(acc); } else acc = +cur;
      op = k; fresh = true; hEl.textContent = `${cur.replace('.', ',')} ${SYM[k]}`;
    } else if (k === '=') {
      if (op) { const r = calc(acc, +cur, op); hEl.textContent = `${raw(acc).replace('.', ',')} ${SYM[op]} ${cur.replace('.', ',')} =`; cur = raw(r); acc = null; op = null; fresh = true; }
    } else if (k === 'clr') { cur = '0'; acc = null; op = null; fresh = true; hEl.textContent = ''; }
    else if (k === 'bs') { if (!fresh) cur = cur.length > 1 && !(cur.length === 2 && cur[0] === '-') ? cur.slice(0, -1) : '0'; }
    else if (k === 'neg') { if (cur !== '0' && cur !== 'Erro') cur = cur[0] === '-' ? cur.slice(1) : '-' + cur; }
    else if (k === 'pct') { cur = raw(+cur / 100); fresh = true; }
    show();
  }
  body.querySelector('.keys').addEventListener('click', e => { const b = e.target.closest('button'); if (b) press(b.dataset.k); });
  return {
    key(e){
      const k = e.key;
      if (/^[0-9]$/.test(k)) press(k);
      else if (k === '.' || k === ',') press('.');
      else if (k === '+' || k === '-' || k === '*' || k === '/') press(k);
      else if (k === 'Enter' || k === '=') press('=');
      else if (k === 'Backspace') press('bs');
      else if (k === 'Escape') press('clr');
      else return false;
      return true;
    }
  };
}

    <div class="row"><div><b>Destaque</b><span>Troca de cena sozinho a cada 40 segundos</span></div><button type="button" class="btn" data-act="next">Próxima cena</button></div>
    <div class="row"><div><b>Sua imagem de fundo</b><span>A imagem fica só neste navegador</span></div>
      <div><button type="button" class="btn" data-act="pick">Escolher imagem</button><button type="button" class="btn" data-act="clear">Remover</button></div></div>
    <input type="file" accept="image/*" hidden data-file></div>`;
  const fileIn = $('[data-file]', body);
  fileIn.addEventListener('change', () => { pickWall(fileIn.files[0]); fileIn.value = ''; });
  function sync(){
    body.querySelectorAll('.seg').forEach(g => g.querySelectorAll('button').forEach(b => b.setAttribute('aria-checked', String(settings[g.dataset.k] === b.dataset.v))));
    body.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-checked', String(!!settings[b.dataset.k])));
  }
  body.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.act === 'pick') { fileIn.click(); return; }
    if (b.dataset.act === 'clear') { clearWall(); return; }
    if (b.dataset.act === 'next') { spotNext(); return; }
    const g = b.closest('[data-k]'); if (!g) return;
    const k = g.dataset.k;
    if (k === 'wall' && b.dataset.v === 'custom' && !wallImg) { fileIn.click(); return; }
    settings[k] = b.classList.contains('sw') ? !settings[k] : b.dataset.v;
    saveSettings(); applySettings();
  });
  sync();
  return { sync };
}

function buildAbout(body){
  body.innerHTML = `<div class="about">
    <h2>LumeOS</h2>
    <p>Prévia visual no navegador de uma distro Debian leve com cara de Windows 11. A ISO real usa XFCE com uma dock e uma barra no topo; aqui você vê o desktop, janelas com animação, jogos e alguns apps.</p>
    <dl><dt>Base</dt><dd>Debian 13, XFCE</dd><dt>Memória</dt><dd>zram com zstd</dd><dt>Tema</dt><dd>Fluent, fonte Inter</dd><dt>Programas Windows</dt><dd>Bottles e Proton</dd></dl>
    <p>Se algo estiver pesado, abra Configurações, ligue o medidor de FPS e desligue o borrão para comparar. Na ISO real o compositor do xfwm4 fica ligado (a dock e os widgets precisam dele), mas o XFCE não tem a animação de minimizar mostrada aqui.</p></div>`;
  return {};
}

/* ---------- início ---------- */
applySettings();
function warmUp(){
  if (reduced() || !fx.blur) return;
  const d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;top:0;width:320px;height:240px;background:var(--win);border-radius:12px;opacity:.02;pointer-events:none;z-index:5;will-change:transform,opacity,filter';
  document.body.append(d);
  d.animate([
    { transform: 'translate3d(0,0,0) scale(1)', opacity: .02, filter: 'blur(0px)' },
    { transform: 'translate3d(60px,60px,0) scale(.4)', opacity: .02, filter: `blur(${fxBlurPx}px)` }
  ], { duration: 400 }).onfinish = () => d.remove();
}
warmUp();
if (desktop.clientWidth >= 900) openApp('about');
openApp('snake');
setTimeout(() => toast('Minimize uma janela para ver a animação. Em Configurações você liga o medidor de FPS.', 7000), 700);
})();
</script>
