# Jogos pesados (Proton) pedem muitos mapeamentos de memoria; o padrao do Linux e 65530
vm.max_map_count = 2147483642

# Menos interrupcoes de vigilancia e rede com melhor controle de fila
kernel.nmi_watchdog = 0
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr

# Muitos arquivos observados (launchers, IDEs)
fs.inotify.max_user_watches = 524288
